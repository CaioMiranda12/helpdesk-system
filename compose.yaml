services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env da raiz}
    volumes:
      - helpdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk_user -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://helpdesk_user:${POSTGRES_PASSWORD}@db:5432/helpdesk
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no arquivo .env da raiz}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      APP_ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - api
volumes:
  helpdesk_pgdata:
